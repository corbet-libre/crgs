schema = 1
project = "crgs"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["bash", "-c", "cargo metadata --locked --format-version 1 > /dev/null"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["git", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "dependency-metadata.json", "dependency-lock.diff"]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
events = ["push", "manual"]
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]


[jobs.verify-pr]
scheduler = "forgejo"
runs_on = "linux"
events = ["pull_request"]
checks = ["verify", "advisories"]
workflow = "pr"
command = ["bash", ".ci/run-cached.sh"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "linux"
events = ["manual"]
checks = ["resolve-dependencies"]
workflow = "resolve"
command = ["bash", ".ci/run-cached.sh"]

[check_shell]

